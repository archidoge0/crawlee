name: "ghav before: Check"
"on":
  push:
    branches:
      - ghav/dev/4055
    paths:
      - .ghav/before
env:
  RETRY_TESTS: 1
jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
        node-version:
          - 22
          - 24
          - 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Turbo cache
        id: turbo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ matrix.node-version }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.node-version }}-${{ github.ref_name }}-
      - uses: apify/workflows/pnpm-install@main
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Install Puppeteer Chrome
        run: pnpm exec puppeteer browsers install chrome
      - name: Build
        run: pnpm ci:build
      - name: Test TS
        run: pnpm tsc-check-tests
      - name: Typecheck documentation examples
        working-directory: ./docs
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
